<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PRAXIS">
  <!-- Favicon mark: the faceted gold pyramid from logo.svg on the app's
       onyx -> bronze tile. Same geometry as tools/make_icons.py so the
       PWA icons, the browser tab and the front page are one identity. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14141a"/>
      <stop offset="1" stop-color="#241c08"/>
    </linearGradient>
    <linearGradient id="lite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e7a8"/>
      <stop offset="1" stop-color="#c9a233"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2210"/>
      <stop offset="1" stop-color="#12100a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e7a8"/>
      <stop offset=".5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#a8842a"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g transform="translate(9.9 9.9) scale(0.85)">
    <polygon points="26,0 50,44 2,44" fill="url(#lite)"/>
    <polygon points="26,0 50,44 26,44" fill="url(#dark)" opacity=".55"/>
    <rect x="0" y="47" width="52" height="5" rx="2.5" fill="url(#gold)"/>
  </g>
</svg>
