# PW Budget — Netlify static deploy (landing page + offline PWA)
# Deploy: `netlify deploy --prod` from the repo root, or drag-and-drop
# the `public/` folder at app.netlify.com/drop.

[build]
  publish = "public"

# The service worker must never be cached long, or installed apps
# won't see new versions.
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Serve the manifest with the correct MIME type (required for installability).
[[headers]]
  for = "/app/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
